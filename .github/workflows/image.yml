name: image
on:
  push:
    branches: [master, python-rewrite]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/nachtalb/hololivesubs:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/master' && 'ghcr.io/nachtalb/hololivesubs:latest' || '' }}

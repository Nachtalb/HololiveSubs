[package]
name = "holozone"
version = "2.0.0"
edition = "2024"
description = "Hololive subscriber ranking, live streams, calendars and RSS feeds"
license = "MIT"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
md5 = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1
